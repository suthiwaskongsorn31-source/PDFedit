<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Studio Pro — จัดการ แก้ไข PDF ภาษาไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.11.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@cantoo/fontkit@2.0.12/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f2f3f6; --panel:#fff; --panel2:#f7f8fa; --ink:#161a22; --ink2:#535b69; --ink3:#8b919c; --line:#e3e5ea; --line2:#d4d7dd;
  --acc:#e5372a; --acc-d:#c12a1f; --acc-l:#fdeceb; --blue:#2563eb; --ok:#16a34a; --hdr:#101319;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07); --thai:"IBM Plex Sans Thai",system-ui,sans-serif;
}
html.dark{ --bg:#0f1115; --panel:#181b21; --panel2:#1e2229; --ink:#e8eaee; --ink2:#a9b0bc; --ink3:#77808d; --line:#2a2f38; --line2:#363c47; --acc-l:#3a1d1b; --hdr:#0a0c0f; --sh:none; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--thai);color:var(--ink);background:var(--bg);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.muted{color:#8a909c}
/* header */
.hdr{height:56px;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#ff5a4c,#c8241a);display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.4px;box-shadow:0 2px 8px rgba(229,55,42,.45)}
.logo .pro{font-size:10px;background:#ffcf4a;color:#3a2a00;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.logo small{display:block;font-weight:400;color:#8e96a3;font-size:11px;margin-top:-2px}
.docinfo{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:#c9ced6;font-size:13px}
.docinfo b{color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.chip{background:#252a33;border-radius:20px;padding:2px 9px;font-size:12px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.chip.ok{background:#14361f;color:#8be0a7}
.chip2{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;line-height:1.2;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--panel2);border-color:var(--line2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d)}
.btn.lg{padding:10px 18px;font-size:15px}
.btn.dark{background:#20242c;border-color:#2c313b;color:#fff}
.btn.dark:hover{background:#2c313b}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.xs{padding:3px 6px;font-size:12px;border-radius:6px}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.xs svg{width:14px;height:14px}
.app{display:flex;height:calc(100% - 56px)}
/* nav */
.nav{width:226px;background:var(--panel);border-right:1px solid var(--line);padding:10px 10px 20px;overflow:auto;flex:none}
.nav .grp{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin:14px 10px 6px;font-weight:600}
.nav .grp:first-child{margin-top:4px}
.tool{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink2);font-size:13.5px}
.tool svg{width:18px;height:18px}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool.act{background:var(--acc-l);color:var(--acc-d);font-weight:600}
html.dark .tool.act{color:#ff8a80}
body.editing .nav{width:64px;padding:8px 6px}
body.editing .nav .grp{display:none}
body.editing .nav .tool{justify-content:center;padding:10px 0}
body.editing .nav .tool span{display:none}
.main{flex:1;min-width:0;overflow:auto;position:relative}
body.editing .main{overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
.wrap.wide{max-width:1400px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.2px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 18px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;gap:6px;align-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px;align-items:start}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label,.lbl{font-size:12.5px;color:var(--ink2);font-weight:500}
.inp{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.inp.num{width:62px;padding:5px 6px}
.hint{font-size:12px;color:var(--ink3)}
.errtxt{color:var(--acc)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel)}
.seg.sm button{padding:5px 7px}
.seg svg{width:15px;height:15px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);cursor:pointer;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.hidden{display:none!important}
/* drop / home */
.drop{border:2px dashed var(--line2);border-radius:16px;background:var(--panel);padding:52px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-l)}
.drop .big{width:66px;height:66px;border-radius:18px;background:var(--acc-l);color:var(--acc);display:grid;place-items:center;margin:0 auto 14px}
.drop .big svg{width:30px;height:30px}
.drop h3{margin:0 0 6px;font-size:18px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:22px}
.feat .f{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:.12s}
.feat .f:hover{border-color:var(--acc);transform:translateY(-1px)}
.feat .f svg{width:20px;height:20px;color:var(--acc);margin-top:2px}
.feat .f b{display:block;font-weight:600;margin-bottom:2px}
.feat .f span{font-size:12.5px;color:var(--ink2)}
.privacy{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ink2);font-size:12.5px;margin-top:14px}
.empty{text-align:center;padding:30px}
.empty svg{color:var(--ink3);display:block;margin:0 auto 8px}
/* toolbar / banners */
.tbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:-10px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:26px;background:var(--line2);margin:0 2px}
.banner{background:#fff7e6;border:1px solid #f5d48a;color:#7a5600;border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center}
.banner.okb{background:#ecfdf3;border-color:#a6e3bf;color:#14532d}
html.dark .banner{background:#3a2e10;border-color:#6b5317;color:#f5d48a}
/* organize */
.pgrid{--ps:170px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ps),1fr));gap:14px}
.pcard{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:8px;box-shadow:var(--sh);position:relative;cursor:pointer;user-select:none}
.pcard.sel{border-color:var(--blue);background:rgba(37,99,235,.06)}
.pcard.dragging{opacity:.35}
.pcard.dropL{box-shadow:-4px 0 0 var(--acc)} .pcard.dropR{box-shadow:4px 0 0 var(--acc)}
.pthumb{height:calc(var(--ps) * 1.12);display:grid;place-items:center;overflow:hidden;background:var(--panel2);border-radius:6px}
.pthumb img{max-width:100%;max-height:100%;box-shadow:0 1px 3px rgba(0,0,0,.2);background:#fff;transition:transform .2s}
.pthumb .blank{height:85%;max-width:85%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.pacts{display:flex;gap:2px}
.pacts button{border:0;background:none;padding:4px;border-radius:6px;cursor:pointer;color:var(--ink2);display:grid;place-items:center}
.pacts button:hover{background:var(--panel2);color:var(--ink)}
.pacts svg{width:15px;height:15px}
.pbadge{position:absolute;top:12px;left:12px;background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;display:none;place-items:center;font-size:12px;z-index:1}
.pcard.sel .pbadge{display:grid}
/* editor */
.ed{display:flex;flex-direction:column;height:100%}
.ed-top{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:6}
.ed-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etools{display:flex;gap:2px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.etools .btn{border-color:transparent;background:transparent;padding:6px 8px}
.etools .btn:hover{background:var(--panel)}
.etools .btn.on{background:var(--ink);color:var(--panel)}
.etools .btn .t{font-size:12.5px}
.btn.zv{min-width:54px;font-size:12.5px}
.eprops{gap:12px;min-height:34px}
.pg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini{font-size:12px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px}
.mini .inp.num{width:52px}
.eprops input[type=range]{width:80px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0;flex:none}
.search{display:flex;align-items:center;gap:4px;position:relative}
.search .inp{width:170px;padding:6px 8px 6px 28px}
.search .sico{position:absolute;left:8px;top:7px;color:var(--ink3)}
.search .sico svg{width:15px;height:15px}
.dd{position:relative}
.ddm{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px;z-index:30;grid-template-columns:repeat(2,1fr);gap:6px;width:300px}
.ddm.open{display:grid}
.ddm.small{width:190px;grid-template-columns:1fr}
.ddm.small button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer}
.ddm.small button:hover{background:var(--panel2)}
.stp{border:2px solid;border-radius:8px;background:var(--panel);padding:6px 4px;font-weight:700;cursor:pointer;font-size:13px}
.stp:hover{background:var(--panel2)}
.ed-body{flex:1;display:flex;min-height:0}
.ed-rail{width:138px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 12px;flex:none}
.rthumb{margin-bottom:12px;cursor:pointer;text-align:center;font-size:11.5px;color:var(--ink3)}
.rthumb img{width:100%;min-height:60px;background:#fff;border:2px solid transparent;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:block}
.rthumb.on img{border-color:var(--acc)} .rthumb.on{color:var(--acc);font-weight:600}
.ed-scroll{flex:1;overflow:auto;background:var(--bg)}
.epages{display:flex;flex-direction:column;align-items:center;gap:26px;padding:28px 24px 80px;min-width:min-content}
.epage{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14);flex:none}
.epage canvas{position:absolute;left:0;top:0}
.epage .plabel{position:absolute;left:0;top:-20px;font-size:11.5px;color:var(--ink3)}
.etxt{position:absolute;z-index:3;border:1.5px dashed var(--blue);outline:none;resize:none;overflow:hidden;padding:0 2px;margin:0;min-width:40px;box-sizing:content-box;tab-size:4}
/* font picker */
.fp-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer;min-width:150px;width:100%;max-width:220px;text-align:left}
.fp-btn .fp-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eprops .fp-btn{width:180px}
.fp-pop{position:fixed;z-index:80;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;padding:8px}
.fp-list{overflow:auto;margin-top:6px}
.fp-cat{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;padding:8px 8px 4px;position:sticky;top:0;background:var(--panel)}
.fp-row{padding:7px 9px;border-radius:8px;cursor:pointer}
.fp-row:hover{background:var(--panel2)} .fp-row.on{background:var(--acc-l)}
.fp-nm{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between}
.fp-st{display:flex;gap:4px;font-size:11px;color:var(--ink3)}
.fp-sm{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
/* preview */
.prev{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:300px}
.prev.col{flex-direction:column;align-items:center}
.prev canvas{box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff;max-width:100%}
.hfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
/* lists */
.ilist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.iitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:11.5px;color:var(--ink2)}
.iitem img{width:100%;height:100px;object-fit:contain;background:#fff;border-radius:4px}
.iitem .pacts{justify-content:center}
.outlist{margin:10px 0 0;padding:0;list-style:none;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.outlist li{padding:7px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;gap:10px}
.outlist li:last-child{border-bottom:0}
.stat{display:flex;gap:12px;margin:12px 0}
.stat div{flex:1;background:var(--panel2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:18px} .stat span{font-size:12px;color:var(--ink2)}
.formlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 16px;max-height:55vh;overflow:auto;padding:2px}
.fitem label{font-size:12.5px;color:var(--ink2);font-weight:500;display:block;margin-bottom:4px}
.pwmeter{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.pwmeter i{display:block;height:100%;width:0;transition:.2s}
/* overlay / modal / toast */
.busy{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;place-items:center;z-index:90}
.busy.on{display:grid}
.busy .bx{background:var(--panel);border-radius:14px;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);min-width:280px;max-width:90vw}
.busy .bt{display:flex;gap:14px;align-items:center}
.busybar{height:5px;background:var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
.busybar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.mback{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;z-index:85;padding:16px}
.modal{background:var(--panel);border-radius:16px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(680px,100%)}
.modal .mh{padding:16px 18px 0;font-weight:600;font-size:16px}
.modal .mb{padding:12px 18px;overflow:auto}
.modal .mf{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.sigpad{border:1px solid var(--line2);border-radius:10px;background:#fff;touch-action:none;width:100%;height:220px;display:block;cursor:crosshair;background-image:linear-gradient(transparent 170px,#d4d7dd 170px,#d4d7dd 171px,transparent 171px)}
.sgfonts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.sgf{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#888}
.sgf.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.sgf canvas{width:100%;height:auto}
.sgsaved{position:relative;display:inline-block}
.sgsaved img{height:48px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:3px}
.sgsaved button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:#ef4444;color:#fff;cursor:pointer;font-size:12px;line-height:18px;padding:0}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:95;align-items:center;pointer-events:none}
.toast{background:#1b1f27;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;animation:tin .2s;max-width:90vw}
.toast.err{background:#b42318} .toast.ok{background:#146c3a}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ic{vertical-align:-2px}
@media (max-width:900px){
  .app{flex-direction:column}
  .nav,body.editing .nav{width:100%;display:flex;gap:4px;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line);flex:none}
  .nav .grp{display:none}
  .tool,body.editing .nav .tool{width:auto;white-space:nowrap;padding:7px 10px}
  body.editing .nav .tool span{display:inline}
  .grid2{grid-template-columns:1fr}
  .logo small,.docinfo .chip.sz,.hdr .btn .t{display:none}
  .hdr{gap:6px;padding:0 8px}
  .wrap{padding:16px 12px 60px}
  .ed-rail{display:none}
  .etools .btn .t{display:none}
  .search .inp{width:120px}
}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><div class="mk">PDF</div><div>PDF Studio<span class="pro">PRO</span><small>แก้ไข PDF ภาษาไทย สระไม่ลอย</small></div></div>
  <div class="docinfo" id="docinfo"></div>
  <button class="btn dark" id="bTheme" title="โหมดมืด/สว่าง"><span data-i="moon"></span></button>
  <button class="btn dark" id="bOpen" title="เปิดไฟล์ (Ctrl+O)"><span data-i="open"></span><span class="t">เปิดไฟล์</span></button>
  <button class="btn dark" id="bUndo" title="ย้อนกลับ (Ctrl+Z)" disabled><span data-i="undo"></span></button>
